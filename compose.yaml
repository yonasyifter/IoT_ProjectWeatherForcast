services:
  fastapi:
    image: 289400854691.dkr.ecr.eu-south-1.amazonaws.com/iotsmartpark/fastapi:latest
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=info
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-side:
    image: 289400854691.dkr.ecr.eu-south-1.amazonaws.com/iotsmartpark/admin-side:latest
    ports:
      - "80:80"
    environment:
      - VITE_BACKEND_URL=http://fastapi:8000
    depends_on:
      - fastapi
    restart: unless-stopped